name: Paper Radar refresh public index
on:
  push:
    paths:
      - 'paper-radar/collect.py'
      - 'paper-radar/catalog.json'
      - '.github/workflows/paper-radar-refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
permissions:
  contents: write
concurrency:
  group: paper-radar-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public parser dependencies
        run: pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect real data and verify bibliographic fields
        run: python paper-radar/collect.py
      - name: Persist verified index
        run: |
          git config user.name 'Paper Radar index'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper-radar/data.json paper-radar/verification.json
          if test -f paper-radar/index.html; then git add paper-radar/index.html; fi
          git diff --cached --quiet || git commit -m 'Refresh public scholarly index with real source report [skip ci]'
          git pull --rebase
          git push
