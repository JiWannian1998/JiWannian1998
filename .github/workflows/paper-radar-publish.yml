name: Paper Radar publish and browser acceptance
on:
  push:
    paths:
      - 'paper-radar/template.html'
      - 'paper-radar/verify_site.py'
      - '.github/workflows/paper-radar-publish.yml'
  workflow_run:
    workflows: ['Paper Radar refresh public index']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: paper-radar-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain actual data collected by hosted runner
        run: |
          for i in $(seq 1 45); do
            git pull --ff-only
            if test -s paper-radar/data.json; then break; fi
            sleep 20
          done
          test -s paper-radar/data.json
      - name: Build self-contained public page
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('paper-radar');d=json.loads((p/'data.json').read_text())
          assert len(d['papers'])>0, 'Cannot publish fake/empty demo results'
          payload=json.dumps(d,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
          (p/'index.html').write_text((p/'template.html').read_text().replace('/*__INITIAL_DATA__*/','window.INITIAL_DATA='+payload+';'),encoding='utf-8')
          PY
      - name: Install browser test tools
        run: |
          pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Test actual content and interactive functions
        id: tests
        continue-on-error: true
        run: python paper-radar/verify_site.py
      - name: Commit built site and browser report
        id: saved
        run: |
          git config user.name 'Paper Radar release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper-radar/index.html paper-radar/browser-report.json
          git diff --cached --quiet || git commit -m 'Publish actual paper index and browser acceptance [skip ci]'
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages when account permission allows
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage only public website files
        run: |
          mkdir -p public
          cp paper-radar/index.html public/index.html
          cp paper-radar/data.json paper-radar/verification.json paper-radar/browser-report.json public/
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success' && steps.tests.outcome == 'success'
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        if: steps.pages.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Verify public website content
        env:
          RELEASE_SHA: ${{ steps.saved.outputs.sha }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_RESULT: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import urllib.request,json,pathlib,os,datetime
          base='https://rawcdn.githack.com/JiWannian1998/JiWannian1998/'+os.environ['RELEASE_SHA']+'/paper-radar/index.html'
          urls=[base]
          if os.environ.get('PAGES_URL'):urls.insert(0,os.environ['PAGES_URL'])
          checks=[]
          for url in urls:
            try:
              with urllib.request.urlopen(url,timeout=40) as r:
                text=r.read().decode('utf-8');checks.append({'url':url,'status':r.status,'valid_site':('论文雷达' in text and 'window.INITIAL_DATA=' in text and 'Conservation Priorities' in text),'bytes':len(text)})
            except Exception as e:checks.append({'url':url,'valid_site':False,'error':str(e)})
          result={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'browser_tests':os.environ['BROWSER_RESULT'],'release_sha':os.environ['RELEASE_SHA'],'checks':checks,'url':next((x['url'] for x in checks if x.get('valid_site')),None)}
          pathlib.Path('paper-radar/deployment.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git add paper-radar/deployment.json
          git diff --cached --quiet || git commit -m 'Record public URL content verification [skip ci]'
          git pull --rebase
          git push
      - name: Package website and verification artifacts
        if: always()
        run: |
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('paper-radar-release.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('paper-radar').glob('*'):
              if p.is_file():z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-radar-release
          path: paper-radar-release.zip
          retention-days: 3
      - name: Enforce browser acceptance
        if: steps.tests.outcome != 'success'
        run: exit 1
