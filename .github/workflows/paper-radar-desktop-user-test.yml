name: Paper Radar Desktop real user path
on:
  workflow_run:
    workflows: ['Paper Radar Desktop Windows release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  user-path:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the actual released EXE
        shell: pwsh
        run: |
          gh release download paper-radar-desktop-v2.0.0 --repo $env:GITHUB_REPOSITORY --pattern PaperRadar_Windows_x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive PaperRadar_Windows_x64.zip -DestinationPath app
          python -m pip install pywinauto pillow
      - name: Start with empty data and click the actual online-search button
        shell: python
        run: |
          import datetime as dt, hashlib, json, os, pathlib, sqlite3, subprocess, time, traceback
          import win32con, win32gui, win32process
          from pywinauto import Desktop
          from pywinauto.application import Application
          root=pathlib.Path.cwd(); out=root/'user_path_verification';out.mkdir(exist_ok=True)
          data=root/'empty-user-data';data.mkdir(exist_ok=True)
          db=data/'radar.sqlite3'
          with sqlite3.connect(db) as c:
              c.execute('CREATE TABLE prefs(key TEXT PRIMARY KEY,payload TEXT NOT NULL)')
              c.execute('INSERT INTO prefs VALUES(?,?)',('selected',json.dumps(['aer'])))
          exe=root/'app'/'PaperRadar'/'PaperRadar.exe'
          archive_hash=hashlib.sha256((root/'PaperRadar_Windows_x64.zip').read_bytes()).hexdigest()
          process=subprocess.Popen([str(exe),'--data-dir',str(data)])
          checks=[];report={};windows=[]
          def native_windows():
              found=[]
              def visit(hwnd,_):
                  if win32process.GetWindowThreadProcessId(hwnd)[1]==process.pid and win32gui.IsWindowVisible(hwnd):found.append((hwnd,win32gui.GetWindowText(hwnd)))
              win32gui.EnumWindows(visit,None)
              return found
          try:
              app=Application(backend='uia').connect(process=process.pid,timeout=40)
              win=app.window(title_re='.*Paper Radar Desktop.*');win.wait('visible',timeout=40)
              checks.append({'name':'actual_released_exe_window','passed':True})
              with sqlite3.connect(db) as c:initial=c.execute('SELECT count(*) FROM papers').fetchone()[0]
              checks.append({'name':'started_without_seed_papers','passed':initial==0,'records':initial})
              button=win.child_window(title='联网搜索论文',control_type='Button')
              button.wait('enabled',timeout=20);button.invoke()
              stop=time.monotonic()+420
              while time.monotonic()<stop:
                  if process.poll() is not None:raise RuntimeError('EXE exited during online search: '+str(process.returncode))
                  try:
                      with sqlite3.connect(db) as c:row=c.execute('SELECT payload FROM runs ORDER BY id DESC LIMIT 1').fetchone()
                      if row:report=json.loads(row[0]);break
                  except sqlite3.OperationalError:pass
                  time.sleep(2)
              if not report:raise RuntimeError('Online search did not finish within acceptance limit')
              with sqlite3.connect(db) as c:papers=[json.loads(r[0]) for r in c.execute('SELECT payload FROM papers')]
              checks.append({'name':'clicked_search_returned_real_papers','passed':bool(papers),'count':len(papers)})
              checks.append({'name':'AER_source_filter','passed':bool(papers) and all(p['source_id']=='aer' for p in papers)})
              target=next((p for p in papers if p.get('doi')=='10.1257/aer.20231016'),None)
              checks.append({'name':'actual_search_contains_known_AER_paper','passed':bool(target and 'Florida Wetlands' in target['title']),'title':target['title'] if target else ''})
              checks.append({'name':'results_visible_count','passed':report.get('shown',0)>0,'shown':report.get('shown')})
              checks.append({'name':'actual_search_matches_public_attention','passed':any(p.get('evidence') for p in papers),'papers_with_evidence':sum(bool(p.get('evidence')) for p in papers)})
              time.sleep(2);win.capture_as_image().save(out/'actual_search.png')
              win.child_window(title='知网辅助检索 / 采集当前结果',control_type='Button').invoke()
              deadline=time.monotonic()+30;browser=None
              while time.monotonic()<deadline:
                  windows=native_windows();browser=next((x for x in windows if x[1].startswith('知网辅助检索')),None)
                  if browser:break
                  time.sleep(1)
              checks.append({'name':'bundled_CNKI_browser_window_opens','passed':browser is not None,'scope':'Native window and bundled engine only; does not verify CNKI access or automatic journal retrieval','visible_windows':[x[1] for x in windows]})
              if browser:
                  time.sleep(3);Desktop(backend='win32').window(handle=browser[0]).capture_as_image().save(out/'cnki_browser_window.png');win32gui.PostMessage(browser[0],win32con.WM_CLOSE,0,0);time.sleep(1)
              main_window=next((x for x in native_windows() if 'Paper Radar Desktop' in x[1]),None)
              if main_window:win32gui.PostMessage(main_window[0],win32con.WM_CLOSE,0,0)
              else:win.close()
              process.wait(timeout=30)
              checks.append({'name':'clean_application_exit','passed':process.returncode==0,'code':process.returncode})
          except Exception:
              checks.append({'name':'actual_user_path_error','passed':False,'detail':traceback.format_exc()})
              try:win.capture_as_image().save(out/'failure.png')
              except Exception:pass
          finally:
              if process.poll() is None:process.terminate()
              result={'tested_at':dt.datetime.now(dt.timezone.utc).isoformat(),'platform':'Windows Server 2022 x64','release_tag':'paper-radar-desktop-v2.0.0','release_zip_sha256':archive_hash,'uses_actual_released_exe':True,'started_without_papers':True,'checks':checks,'search_report':report,'passed':sum(x['passed'] for x in checks),'total':len(checks)}
              (out/'actual_exe_network_test.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(result,ensure_ascii=True,indent=2))
          if any(not c['passed'] for c in checks):raise SystemExit(2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PaperRadar-actual-EXE-network-test
          path: user_path_verification/
          retention-days: 2
