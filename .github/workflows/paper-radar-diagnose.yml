name: Paper Radar diagnose public sources
on:
  push:
    paths:
      - '.github/workflows/paper-radar-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual API responses
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, pathlib, datetime, time
          base='https://api.crossref.org'
          probes=[
            ('journal_min',base+'/journals/0002-8282/works?rows=2'),
            ('journal_filter',base+'/journals/0002-8282/works?'+urllib.parse.urlencode({'rows':2,'filter':'from-pub-date:2025-10-24,until-pub-date:2026-10-24,type:journal-article'})),
            ('journal_cursor',base+'/journals/0002-8282/works?'+urllib.parse.urlencode({'rows':2,'filter':'from-pub-date:2025-10-24,until-pub-date:2026-10-24,type:journal-article','cursor':'*','sort':'published','order':'desc'})),
            ('works_filter',base+'/works?'+urllib.parse.urlencode({'rows':2,'filter':'issn:0002-8282,from-pub-date:2025-10-24,until-pub-date:2026-10-24'})),
            ('nber_min',base+'/prefixes/10.3386/works?rows=2'),
            ('nber_digest','https://www.nber.org/digest'),
            ('nber_digest_archive','https://www.nber.org/digest/202610'),
          ]
          out=[]
          for name,url in probes:
            row={'name':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'PaperRadar/1.0 (+https://github.com/JiWannian1998/JiWannian1998)','Accept':'application/json,text/html;q=0.9'})
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(200000).decode('utf-8','replace');row.update(status=r.status,final_url=r.url)
                if name.startswith(('journal','works','nber_min')):
                  m=json.loads(body).get('message',{});row.update(total=m.get('total-results'),titles=[{'doi':x.get('DOI'),'title':x.get('title')} for x in m.get('items',[])])
                else:row['body_excerpt']=body[:1000]
            except urllib.error.HTTPError as e:
              row.update(status=e.code,body_excerpt=e.read(3500).decode('utf-8','replace'))
            except Exception as e:row['error']=str(e)
            out.append(row);print(json.dumps(row,ensure_ascii=False));time.sleep(1)
          pathlib.Path('paper-radar/diagnosis.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks':out},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Save diagnosis
        run: |
          git config user.name 'Paper Radar checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper-radar/diagnosis.json
          git diff --cached --quiet || git commit -m 'Save live API query diagnostics [skip ci]'
          git pull --rebase
          git push
